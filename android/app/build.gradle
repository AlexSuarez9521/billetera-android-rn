apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // Los cuatro bundles se generan con `npm run bundles` y ya viven en assets; si release no
    // está aquí, el plugin intenta empaquetar un index.js que no existe.
    debuggableVariants = ["debug", "debugOptimized", "release"]
    autolinkLibrariesWithApp()
}

def archivoDeFirma = rootProject.file("keystore.properties")

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.asuarez.billetera"
    defaultConfig {
        applicationId "com.asuarez.billetera"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "int", "SESION_MINUTOS", "2"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (archivoDeFirma.exists()) {
            def firma = new Properties()
            archivoDeFirma.withInputStream { firma.load(it) }
            release {
                storeFile file(firma['storeFile'])
                storePassword firma['storePassword']
                keyAlias firma['keyAlias']
                keyPassword firma['keyPassword']
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            buildConfigField "int", "SESION_MINUTOS", "10"
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            if (archivoDeFirma.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("Sin keystore.properties: release firmado con la llave de depuración, solo para evaluación")
                signingConfig signingConfigs.debug
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20260814"

    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:core:1.7.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
}
